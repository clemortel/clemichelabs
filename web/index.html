  <!-- Dark loading screen -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f2223;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Space Grotesk', sans-serif;
    }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .loading-text {
      color: #00f2ff;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #162e2f;
      border-top: 3px solid #00f2ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading">
    <div class="loading-text">ClemicheLabs</div>
    <div class="loading-spinner"></div>
  </div>
