name: clemichelabs
description: "ClemicheLabs – Micro-SaaS Studio & CTO-for-Hire"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Data Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1

  # UI & Widgets
  google_fonts: ^8.0.1
  flutter_animate: ^4.5.0
  url_launcher: ^6.3.0

  # Web
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.6
  freezed: ^3.2.3
  json_serializable: ^6.7.1
  riverpod_generator: ^4.0.0+1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
